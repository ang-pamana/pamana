<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Story View — Pamana</title>
    <link rel="icon" type="image/png" href="https://ang-pamana.github.io/pamana/pamanalogo.png">
    <style>
        *, *::before, *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html, body {
            width: 100%;
            height: 100%;
            background: #121212;
            overflow: hidden;
        }
        iframe {
            width: 100%;
            height: 100vh;
            border: 0 !important;
            outline: none !important;
            display: block;
        }
        .error-msg {
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            text-align: center;
            margin-top: 20vh;
        }
    </style>
</head>
<body>

    <iframe id="storyFrame" src="" allowfullscreen scrolling="no"></iframe>

    <script>
        // Kukunin ang Canva Design ID mula sa URL parameter (?id=...)
        var urlParams = new URLSearchParams(window.location.search);
        var canvaId = urlParams.get('id');

        if (canvaId) {
            // Direktang ipapakita ang malinis na Canva Embed View ng kwento
            document.getElementById('storyFrame').src = 'https://www.canva.com/design/' + canvaId + '/view?embed';
        } else {
            document.body.innerHTML = '<h2 class="error-msg">Hindi mahanap ang kuwento. Bumalik sa main page.</h2>';
        }
    </script>
</body>
</html>
