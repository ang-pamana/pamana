<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pamana — Official Portal</title>
    <link rel="icon" type="image/png" href="https://ang-pamana.github.io/pamana/pamanalogo.png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Google Analytics 4 (GA4) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-17P5Q860F3"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-17P5Q860F3');
    </script>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #121212; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; overflow-x: hidden; }
        
        /* Sticky Header - Mas Malaki sa Desktop */
        .sticky-header {
            position: fixed; top: 0; left: 0; width: 100%; height: 64px;
            background: rgba(18, 18, 18, 0.95); backdrop-filter: blur(10px);
            display: flex; justify-content: space-between; align-items: center;
            padding: 0 24px; z-index: 9999; border-bottom: 1px solid rgba(255,255,255,0.1);
        }
        .brand-container { display: flex; align-items: center; gap: 10px; }
        .brand-title {
            font-family: 'Georgia', serif; font-size: 22px; font-weight: 800; letter-spacing: 1px;
            background: linear-gradient(90deg, #ff4e00 0%, #ec9f05 100%);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }

        /* Desktop Navigation Links - Mas Malaking Text & Spacing */
        .desktop-nav { display: flex; gap: 28px; align-items: center; }
        .desktop-nav a {
            color: #e0e0e0; text-decoration: none; font-size: 14px; font-weight: 700;
            text-transform: uppercase; letter-spacing: 0.8px; transition: all 0.3s ease; position: relative; padding: 8px 0;
        }
        .desktop-nav a:hover, .desktop-nav a.active { color: #ff4e00; }
        .desktop-nav a.active::after, .desktop-nav a:hover::after {
            content: ''; position: absolute; width: 100%; height: 3px; bottom: 0; left: 0; background-color: #ff4e00; border-radius: 2px;
        }

        /* Mobile Bottom Navigation Bar */
        .mobile-bottom-nav {
            display: none; position: fixed; bottom: 0; left: 0; width: 100%; height: 58px;
            background: rgba(18, 18, 18, 0.98); backdrop-filter: blur(12px);
            border-top: 1px solid rgba(255, 255, 255, 0.12);
            justify-content: space-around; align-items: center; z-index: 9999;
        }
        .mobile-bottom-nav a {
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            color: #8e8e93; text-decoration: none; font-size: 9px; font-weight: 600; width: 100%; height: 100%;
            transition: color 0.2s ease;
        }
        .mobile-bottom-nav a i { font-size: 17px; margin-bottom: 3px; }
        .mobile-bottom-nav a.active, .mobile-bottom-nav a:hover { color: #ff4e00; }

        /* Responsive Breakpoints */
        .content-container { margin-top: 64px; margin-bottom: 0px; width: 100%; }
        
        @media (max-width: 850px) {
            .sticky-header { height: 52px; padding: 0 16px; }
            .brand-title { font-size: 18px; }
            .desktop-nav { display: none; }
            .mobile-bottom-nav { display: flex; }
            .content-container { margin-top: 52px; margin-bottom: 58px; }
        }

        .canva-block { width: 100%; position: relative; background: #ffffff; }
        .canva-block iframe { width: 100%; border: none; display: block; }
    </style>
</head>
<body>

    <header class="sticky-header">
        <div class="brand-container">
            <img src="pamana(1).png" alt="Logo" style="height:32px;">
            <span class="brand-title">PAMANA</span>
        </div>
        <nav class="desktop-nav">
            <a href="index.html" class="active">Home</a>
            <a href="culture.html">Culture</a>
            <a href="environment.html">Environment</a>
            <a href="heritage.html">Heritage</a>
            <a href="feature.html">Feature</a>
            <a href="team.html">Meet the Team</a>
        </nav>
    </header>

    <main class="content-container">
        <div class="canva-block">
            <div style="position: relative; width: 100%; height: 0; padding-top: 288.6530%;">
                <iframe loading="lazy" style="position: absolute; width: 100%; height: 100%; top: 0; left: 0;" src="https://www.canva.com/design/DAHaUonab1A/SsyWwRGyMcmPS5dNC3Ji4Q/view?embed" allowfullscreen></iframe>
            </div>
        </div>
    </main>

    <!-- Mobile Bottom Nav Bar -->
    <nav class="mobile-bottom-nav">
        <a href="index.html" class="active"><i class="fa-solid fa-house"></i>Home</a>
        <a href="culture.html"><i class="fa-solid fa-masks-theater"></i>Culture</a>
        <a href="environment.html"><i class="fa-solid fa-leaf"></i>Environment</a>
        <a href="heritage.html"><i class="fa-solid fa-landmark"></i>Heritage</a>
        <a href="feature.html"><i class="fa-solid fa-newspaper"></i>Feature</a>
        <a href="team.html"><i class="fa-solid fa-users"></i>Team</a>
    </nav>

</body>
</html>
