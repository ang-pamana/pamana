<!DOCTYPE html>
<html lang="tl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pamana Website</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow-x: hidden;
            background-color: #ffffff;
        }
        .canva-wrapper {
            position: relative;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
        }
        .canva-wrapper iframe {
            position: absolute;
            top: -40px; /* Tinatago ang upper control bar */
            left: 0;
            width: 100%;
            height: calc(100% + 80px); /* Tinatago ang lower slide navigation bar */
            border: none;
        }
    </style>
</head>
<body>

    <div class="canva-wrapper">
        <iframe loading="lazy" src="https://www.canva.com/design/DAHVziF8Y2c/gG6N_M4zl5NHV3enyFfHRg/view?embed" allowfullscreen="allowfullscreen" allow="fullscreen"></iframe>
    </div>

</body>
</html>
