    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #ffffff;
            font-family: Arial, sans-serif;
        }

        /* Top Header Container */
        .sticky-header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 48px;
            background-color: rgba(255, 255, 255, 0.98);
            display: flex;
            justify-content: flex-start;
            align-items: center;
            padding: 0 20px;
            z-index: 9999;
            box-shadow: 0 2px 6px rgba(0,0,0,0.08);
        }

        /* Branding Box (Logo + Text) */
        .brand-container {
            display: flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
        }

        .brand-container img {
            max-height: 38px;
            width: auto;
            object-fit: contain;
        }

        /* Red-Orange-Yellow Gradient PAMANA Title */
        .brand-title {
            font-family: 'Georgia', 'Times New Roman', serif;
            font-size: 20px;
            font-weight: 800;
            letter-spacing: 2px;
            text-transform: uppercase;
            background: linear-gradient(90deg, #ff0000 0%, #ff6a00 50%, #ffb700 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-fill-color: transparent;
        }

        /* Embedded Canva Frame */
        iframe {
            width: 100vw;
            height: calc(100vh - 78px);
            margin-top: 48px;
            border: none;
            display: block;
        }

        /* Fixed Compact Bottom Footer */
        .sticky-footer {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 30px;
            background-color: #1a1a1a;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            z-index: 9999;
            box-shadow: 0 -2px 6px rgba(0,0,0,0.15);
        }

        .footer-item {
            display: flex;
            align-items: center;
            gap: 6px;
            color: #ffffff;
            text-decoration: none;
            font-size: 11px;
            transition: color 0.2s ease;
        }

        .footer-item:hover {
            color: #ff6a00;
        }

        .footer-item i {
            font-size: 13px;
        }

        /* Welcome Pop-up Overlay Styles */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.6);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 999999;
            opacity: 1;
            transition: opacity 0.3s ease;
            padding: 20px;
        }

        .modal-content {
            background-color: #ffffff;
            border-radius: 12px;
            max-width: 450px;
            width: 100%;
            padding: 25px 20px;
            text-align: center;
            position: relative;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            animation: popupAnimation 0.4s ease-out;
        }

        @keyframes popupAnimation {
            from {
                transform: scale(0.8);
                opacity: 0;
            }
            to {
                transform: scale(1);
                opacity: 1;
            }
        }

        .close-btn {
            position: absolute;
            top: 10px;
            right: 15px;
            font-size: 24px;
            font-weight: bold;
            color: #888888;
            cursor: pointer;
            transition: color 0.2s ease;
        }

        .close-btn:hover {
            color: #ff0000;
        }

        .modal-logo {
            max-height: 50px;
            width: auto;
            margin-bottom: 10px;
        }

        .modal-title {
            font-family: 'Georgia', serif;
            font-size: 22px;
            color: #2c2c2c;
            margin-bottom: 10px;
            font-weight: 700;
        }

        .modal-text {
            font-size: 14px;
            color: #555555;
            line-height: 1.5;
            margin-bottom: 20px;
        }

        .action-btn {
            background: linear-gradient(90deg, #ff0000 0%, #ff6a00 50%, #ffb700 100%);
            color: #ffffff;
            border: none;
            padding: 10px 24px;
            font-size: 14px;
            font-weight: bold;
            border-radius: 25px;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(255, 106, 0, 0.3);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .action-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 14px rgba(255, 106, 0, 0.4);
        }

        /* Mobile View Rules */
        @media (max-width: 600px) {
            .sticky-header {
                height: 36px;
                padding: 0 12px;
            }
            .brand-container {
                gap: 8px;
            }
            .brand-container img {
                max-height: 26px;
            }
            .brand-title {
                font-size: 15px;
                letter-spacing: 1px;
            }
            iframe {
                height: calc(100vh - 64px);
                margin-top: 36px;
            }
            .sticky-footer {
                height: 28px;
                gap: 10px;
                padding: 0 5px;
            }
            .footer-item {
                font-size: 10px;
            }
            .footer-item i {
                font-size: 11px;
            }
            .modal-content {
                padding: 20px 15px;
            }
            .modal-title {
                font-size: 18px;
            }
            .modal-text {
                font-size: 13px;
            }
        }
