<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pamana — Official Portal</title>
    <link rel="icon" type="image/png" href="https://ang-pamana.github.io/pamana/pamanalogo.png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Google Analytics 4 (GA4) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-17P5Q860F3"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-17P5Q860F3');
    </script>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #121212; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; overflow-x: hidden; }
        
        .sticky-header {
            position: fixed; top: 0; left: 0; width: 100%; height: 64px;
            background: #ffffff;
            display: flex; justify-content: space-between; align-items: center;
            padding: 0 24px; z-index: 9999; box-shadow: 0 2px 8px rgba(0,0,0,0.15);
        }
        .brand-container { display: flex; align-items: center; gap: 12px; }
        .brand-logo { height: 38px; width: 38px; border-radius: 50%; object-fit: cover; }
        
        .brand-title {
            font-family: 'Georgia', serif; font-size: 22px; font-weight: 800; letter-spacing: 1px;
            background: linear-gradient(90deg, #ff4e00 0%, #ec9f05 100%);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }

        .desktop-nav { display: flex; gap: 28px; align-items: center; }
        .desktop-nav a {
            color: #222222; text-decoration: none; font-size: 14px; font-weight: 700;
            text-transform: uppercase; letter-spacing: 0.8px; transition: all 0.3s ease; position: relative; padding: 8px 0;
        }
        .desktop-nav a:hover, .desktop-nav a.active { color: #ff4e00; }
        .desktop-nav a.active::after, .desktop-nav a:hover::after {
            content: ''; position: absolute; width: 100%; height: 3px; bottom: 0; left: 0; background-color: #ff4e00; border-radius: 2px;
        }

        .mobile-menu-btn {
            display: none; background: none; border: none; color: #222222; font-size: 24px; cursor: pointer; padding: 4px;
        }
        
        .mobile-dropdown {
            display: none; position: fixed; top: 64px; left: 0; width: 100%;
            background: #ffffff; flex-direction: column; border-bottom: 3px solid #ff4e00;
            box-shadow: 0 10px 20px rgba(0,0,0,0.2); z-index: 9998;
        }
        .mobile-dropdown a {
            color: #222222; text-decoration: none; padding: 14px 24px; font-size: 14px;
            font-weight: 700; text-transform: uppercase; border-bottom: 1px solid #f0f0f0;
        }
        .mobile-dropdown a.active, .mobile-dropdown a:hover { background: #fff5f0; color: #ff4e00; }
        .mobile-dropdown.open { display: flex; }

        /* Welcome Toast Message Style */
        .toast-msg {
            position: fixed; bottom: 20px; right: 20px; background: #ff4e00; color: #fff;
            padding: 12px 24px; border-radius: 30px; font-size: 13px; font-weight: 700;
            box-shadow: 0 4px 15px rgba(255, 78, 0, 0.4); z-index: 10000;
            opacity: 0; display: none; transition: opacity 0.3s ease;
        }

        .content-container { margin-top: 64px; width: 100%; }
        
        @media (max-width: 850px) {
            .sticky-header { height: 56px; padding: 0 16px; }
            .brand-logo { height: 32px; width: 32px; }
            .brand-title { font-size: 18px; }
            .desktop-nav { display: none; }
            .mobile-menu-btn { display: block; }
            .mobile-dropdown { top: 56px; }
            .content-container { margin-top: 56px; }
        }

        .canva-block { width: 100%; position: relative; background: #ffffff; }
        .canva-block iframe { width: 100%; border: none; display: block; }
    </style>
</head>
<body>

    <header class="sticky-header">
        <div class="brand-container">
            <img src="pamanalogo.png" alt="Logo" class="brand-logo">
            <span class="brand-title">PAMANA</span>
        </div>

        <nav class="desktop-nav">
            <a href="index.html" class="active">Home</a>
            <a href="culture.html">Culture</a>
            <a href="environment.html">Environment</a>
            <a href="heritage.html">Heritage</a>
            <a href="feature.html">Feature</a>
            <a href="team.html">Meet the Team</a>
        </nav>

        <button class="mobile-menu-btn" onclick="toggleMobileMenu()" aria-label="Toggle Navigation">
            <i class="fa-solid fa-bars"></i>
        </button>
    </header>

    <div class="mobile-dropdown" id="mobileMenu">
        <a href="index.html" class="active">Home</a>
        <a href="culture.html">Culture</a>
        <a href="environment.html">Environment</a>
        <a href="heritage.html">Heritage</a>
        <a href="feature.html">Feature</a>
        <a href="team.html">Meet the Team</a>
    </div>

    <!-- Toast Notification Element -->
    <div id="toast" class="toast-msg">Welcome to Pamana Digital Portal!</div>

    <main class="content-container">
        <div class="canva-block">
            <div style="position: relative; width: 100%; height: 0; padding-top: 288.6530%;">
                <iframe loading="lazy" style="position: absolute; width: 100%; height: 100%; top: 0; left: 0;" src="https://www.canva.com/design/DAHaUonab1A/SsyWwRGyMcmPS5dNC3Ji4Q/view?embed" allowfullscreen></iframe>
            </div>
        </div>
    </main>

    <script>
        function toggleMobileMenu() {
            var menu = document.getElementById('mobileMenu');
            menu.classList.toggle('open');
        }

        function showToast() {
            var toast = document.getElementById('toast');
            if (toast) {
                toast.style.display = 'block';
                setTimeout(function() { toast.style.opacity = '1'; }, 50);
                setTimeout(function() {
                    toast.style.opacity = '0';
                    setTimeout(function() { toast.style.display = 'none'; }, 300);
                }, 3000);
            }
        }
        window.addEventListener('load', showToast);
    </script>
</body>
</html>
