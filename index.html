    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #ffffff;

        /* Top Header Container */
        .sticky-header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 48px;
            background-color: rgba(255, 255, 255, 0.98);
            display: flex;
            justify-content: flex-start;
            align-items: center;
            padding: 0 20px;
            z-index: 9999;

        }

        /* Branding Box (Logo + Text) */
        .brand-container {
            display: flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
        }

        .brand-container img {
            max-height: 38px;
            width: auto;
            object-fit: contain;
        }

        /* Red-Orange-Yellow Gradient PAMANA Title */
        .brand-title {
            font-family: 'Georgia', 'Times New Roman', serif;
            font-size: 20px;
            font-weight: 800;
            letter-spacing: 2px;
            text-transform: uppercase;
            background: linear-gradient(90deg, #ff0000 0%, #ff6a00 50%, #ffb700 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            text-fill-color: transparent;
        }

        /* Embedded Canva Presentation Frame */
        iframe {
            width: 100vw;
            height: calc(100vh - 78px); /* Inadjust ang taas para sa header (48px) at footer (30px) */
            margin-top: 48px;
            border: none;
            display: block;
        }

        /* Manipis at Maayos na Fixed Bottom Footer */
        .sticky-footer {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 30px; /* Binawasan ang kapal mula 40px papuntang 30px */
            background-color: #1a1a1a;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            z-index: 9999;
            box-shadow: 0 -2px 6px rgba(0,0,0,0.15);
            font-family: Arial, sans-serif;
        }

        .footer-item {
            display: flex;
            align-items: center;
            gap: 6px;
            color: #ffffff;
            text-decoration: none;
            font-size: 11px; /* Maliit at maayos na font size */
            transition: color 0.2s ease;
        }

        .footer-item:hover {
            color: #ff6a00;
        }

        .footer-item i {
            font-size: 13px;
        }

        /* Responsive Layout para sa Cellphone */
        @media (max-width: 600px) {
            .sticky-footer {
                gap: 10px;
                padding: 0 5px;
            }
            .footer-item {
                font-size: 10px;
            }
            .footer-item i {
                font-size: 11px;
            }
        }
