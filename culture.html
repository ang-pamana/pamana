<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pamana — Bicol Culture</title>
    <link rel="icon" type="image/png" href="https://ang-pamana.github.io/pamana/pamanalogo.png">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: #121212; font-family: Arial, sans-serif; overflow-x: hidden; }

        .sticky-header {
            position: fixed; top: 0; left: 0; width: 100%; height: 48px;
            background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px);
            display: flex; justify-content: space-between; align-items: center;
            padding: 0 16px; z-index: 9999; box-shadow: 0 2px 6px rgba(0,0,0,0.1);
        }
        .brand-title {
            font-family: 'Georgia', serif; font-size: 18px; font-weight: 800;
            background: linear-gradient(90deg, #ff0000 0%, #ff6a00 50%, #ffb700 100%);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }

        .content-container { margin-top: 48px; margin-bottom: 30px; width: 100%; }
        
        .canva-block { display: none; width: 100%; position: relative; background: #ffffff; }
        .canva-block.active { display: block; }
        .canva-block iframe { width: 100%; border: none; display: block; }

        .sticky-footer {
            position: fixed; bottom: 0; left: 0; width: 100%; height: 30px;
            background: #1a1a1a; display: flex; justify-content: center; align-items: center; gap: 20px; z-index: 9999;
        }
        .footer-item { color: #fff; text-decoration: none; font-size: 11px; display: flex; align-items: center; gap: 6px; }
    </style>
</head>
<body>

    <header class="sticky-header">
        <div style="display:flex; align-items:center; gap:8px;">
            <img src="pamana(1).png" alt="Logo" style="height:28px;">
            <span class="brand-title">BICOL CULTURE</span>
        </div>
    </header>

    <main class="content-container">
        <!-- Section 2 - Bicol Culture Main -->
        <div id="culture-main" class="canva-block active">
            <div style="position: relative; width: 100%; height: 0; padding-top: 339.0190%;">
                <iframe loading="lazy" style="position: absolute; width: 100%; height: 100%; top: 0; left: 0;" src="https://www.canva.com/design/DAHaUAY48YM/jjZ81TBn3RaThz3ZDd9WmQ/view?embed" allowfullscreen></iframe>
            </div>
        </div>

        <!-- Subsection 1 - Courtship & Culture -->
        <div id="courtship" class="canva-block">
            <div style="position: relative; width: 100%; height: 0; padding-top: 205.9297%;">
                <iframe loading="lazy" style="position: absolute; width: 100%; height: 100%; top: 0; left: 0;" src="https://www.canva.com/design/DAHaUZ1_B6I/mDc403l44re_WCzgH0sl8w/view?embed" allowfullscreen></iframe>
            </div>
        </div>

        <!-- Subsection 2 - Three-Headed Statue -->
        <div id="statue" class="canva-block">
            <div style="position: relative; width: 100%; height: 0; padding-top: 258.5652%;">
                <iframe loading="lazy" style="position: absolute; width: 100%; height: 100%; top: 0; left: 0;" src="https://www.canva.com/design/DAHaUWaX9DE/EVsmPcA47_hchUXGqrml9A/view?embed" allowfullscreen></iframe>
            </div>
        </div>

        <!-- Subsection 3 - Visiting the Past -->
        <div id="past-present" class="canva-block">
            <div style="position: relative; width: 100%; height: 0; padding-top: 246.3397%;">
                <iframe loading="lazy" style="position: absolute; width: 100%; height: 100%; top: 0; left: 0;" src="https://www.canva.com/design/DAHaUTEGMyI/iVzJsca9dQaUIRnmjvpRBA/view?embed" allowfullscreen></iframe>
            </div>
        </div>

        <!-- Subsection 4 - The Pili -->
        <div id="pili" class="canva-block">
            <div style="position: relative; width: 100%; height: 0; padding-top: 218.8873%;">
                <iframe loading="lazy" style="position: absolute; width: 100%; height: 100%; top: 0; left: 0;" src="https://www.canva.com/design/DAHaUeXRvEs/sq596t1pP9azFl3ZVqeydQ/view?embed" allowfullscreen></iframe>
            </div>
        </div>

        <!-- Subsection 5 - Sili Ice Cream -->
        <div id="sili-ice-cream" class="canva-block">
            <div style="position: relative; width: 100%; height: 0; padding-top: 266.3982%;">
                <iframe loading="lazy" style="position: absolute; width: 100%; height: 100%; top: 0; left: 0;" src="https://www.canva.com/design/DAHaUWtWOPo/_-ubVIFZvvobBvY6nEa5ng/view?embed" allowfullscreen></iframe>
            </div>
        </div>
    </main>

    <footer class="sticky-footer">
        <a href="https://facebook.com" target="_blank" class="footer-item"><i class="fa-brands fa-facebook"></i> The Sentinel</a>
        <a href="https://tiktok.com/@pamana.bicolnon" target="_blank" class="footer-item"><i class="fa-brands fa-tiktok"></i> pamana.bicolnon</a>
        <a href="mailto:pamanangbicolnon@gmail.com" class="footer-item"><i class="fa-solid fa-envelope"></i> pamanangbicolnon@gmail.com</a>
    </footer>

    <script>
        function handleTabSwitch() {
            var hash = window.location.hash;
            var blocks = document.querySelectorAll('.canva-block');
            if (hash) {
                var targetBlock = document.querySelector(hash);
                if (targetBlock) {
                    blocks.forEach(function(b) { b.classList.remove('active'); });
                    targetBlock.classList.add('active');
                    window.scrollTo({ top: 0, behavior: 'instant' });
                }
            } else {
                blocks.forEach(function(b) { b.classList.remove('active'); });
                document.getElementById('culture-main').classList.add('active');
            }
        }
        window.addEventListener('hashchange', handleTabSwitch);
        window.addEventListener('load', handleTabSwitch);
    </script>
</body>
</html>
